openapi: 3.1.0
info:
  title: Mulsigye API
  version: 1.0.0
  description: 수신호 웹과 Android가 함께 소비하는 버전 고정 API 계약
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: 공개 API 프로세스 상태 확인
      responses:
        "200":
          description: API가 요청을 받을 수 있음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                ok:
                  value:
                    schemaVersion: "1"
                    service: mulsigye-api
                    status: ok
                    asOf: "2026-07-19T00:00:00.000Z"
                    sources: []
                    stale: false
        "503":
          description: API 프로세스가 요청을 처리할 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/regions/search:
    get:
      operationId: searchRegions
      summary: 주소 검색으로 지역 후보 목록 조회
      parameters:
        - name: q
          in: query
          required: true
          description: 사용자가 입력한 주소 검색어. 원문은 응답 후 폐기하며 저장하지 않는다.
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: 주소 후보 목록. 후보가 없으면 빈 배열
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegionSearchResponse"
              examples:
                ok:
                  value:
                    schemaVersion: "1"
                    candidates:
                      - label: 전라남도 나주시 시청길 22 (송월동)
                        admCd: "1217010200"
                        legalCode: "4617010200"
                    asOf: "2026-07-21T00:00:00.000Z"
                    sources:
                      - 도로명주소 API
                    stale: false
        "400":
          description: >-
            사용자가 고칠 수 있는 검색어 문제 (모두 `retryable=false`).
            도로명주소 공식 오류표를 사유별로 옮긴 것이며, `message`가 무엇을 바꿔야 하는지
            알려준다. 분류의 단일 출처는 `apps/web/src/lib/data/juso.ts`의 `JusoFailureReason`다.

            | code | 사유(공식 오류메시지) |
            |---|---|
            | `INVALID_QUERY` | 서버 자체 검증 — 검색어 없음·두 글자 미만·100자 초과 |
            | `JUSO_TOO_BROAD` | 주소를 상세히 입력해 주시기 바랍니다(시도명 검색 불가) |
            | `JUSO_TOO_MANY` | 검색 범위를 초과하였습니다(9천건 초과) |
            | `JUSO_TOO_SHORT` | 검색어는 두글자 이상 입력되어야 합니다 |
            | `JUSO_DIGITS_ONLY` | 검색어는 문자와 숫자 같이 입력되어야 합니다 |
            | `JUSO_LONG_NUMBER` | 검색어에 너무 긴 숫자가 포함되어 있습니다 |
            | `JUSO_TOO_LONG` | 검색어가 너무 깁니다 |
            | `JUSO_FORBIDDEN_CHARS` | 특수문자+숫자만 / SQL 예약어·특수문자 |
            | `JUSO_EMPTY` | 검색어가 입력되지 않았습니다 |
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                tooBroad:
                  summary: 시·도 이름만 입력(인천·제주 등)
                  value:
                    code: JUSO_TOO_BROAD
                    message: 시·도 이름만으로는 찾을 수 없어요. ‘인천 남동구’처럼 시·군·구까지 넣어 주세요.
                    retryable: false
                tooMany:
                  summary: 결과 9천건 초과
                  value:
                    code: JUSO_TOO_MANY
                    message: 결과가 너무 많아요. 읍·면·동이나 도로명까지 넣으면 찾을 수 있어요.
                    retryable: false
                invalidQuery:
                  summary: 서버 자체 검증(두 글자 미만 등)
                  value:
                    code: INVALID_QUERY
                    message: 검색어를 두 글자 이상 입력해 주세요.
                    retryable: false
        "503":
          description: >-
            도로명주소 API 쪽 문제. **`retryable`이 사유에 따라 다르다** —
            일시 장애(`JUSO_UNAVAILABLE`)는 `true`지만, 승인키 문제(`JUSO_AUTH`:
            승인되지 않은 KEY·개발승인키 만료·비정상 경로)는 다시 눌러도 풀리지 않으므로
            `false`다. 클라이언트는 `retryable`을 보고 '다시 시도' 버튼을 결정한다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                unavailable:
                  summary: 일시 장애·timeout·표에 없는 응답
                  value:
                    code: JUSO_UNAVAILABLE
                    message: 주소 검색이 잠시 어려워요. 조금 뒤에 다시 시도해 주세요.
                    retryable: true
                auth:
                  summary: 승인키 문제 — 재시도로 풀리지 않는다
                  value:
                    code: JUSO_AUTH
                    message: 주소 검색을 지금은 쓸 수 없어요. 잠시 뒤에 다시 시도해 주세요.
                    retryable: false
  /api/v1/reservoirs/search:
    get:
      operationId: searchReservoirs
      summary: 저수지 이름으로 후보 조회
      description: >-
        주소를 몰라도 아는 저수지 이름으로 지역을 등록할 수 있게 한다. 넓은 시군에서는
        주소만으로 원하는 저수지가 잡히지 않을 수 있다(제주시 5곳 등). 후보는 커밋 스냅샷
        (시설제원 정규화본)에서만 오고 좌표·거리는 쓰지 않는다.
      parameters:
        - name: q
          in: query
          required: true
          description: 저수지 이름 또는 소재지 일부. 두 글자 이상.
          schema:
            type: string
            minLength: 2
            maxLength: 30
      responses:
        "200":
          description: 저수지 후보 목록(최대 20건). 없으면 빈 배열
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservoirSearchResponse"
              examples:
                ok:
                  value:
                    schemaVersion: "1"
                    reservoirs:
                      - facCode: "5011010007"
                        name: 함덕
                        address: 제주특별자치도 제주시 조천읍 함덕리
                        sigunCode: "50110"
                        sigunName: 제주시
                        prepared: true
                    asOf: "2026-07-26T00:00:00.000Z"
                    sources:
                      - 농업기반시설 시설제원_저수지
                    stale: false
        "400":
          description: 검색어가 없거나 두 글자 미만 (retryable=false)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/regions/resolve:
    post:
      operationId: resolveRegion
      summary: 선택한 주소를 시군구와 우리 지역 대표 저수지로 확정
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegionResolveRequest"
      responses:
        "200":
          description: >-
            시군구·대표 저수지 결정 결과. 후보가 없는 지역은 prepared=false로
            HTTP 200을 유지한다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegionResolveResponse"
              examples:
                ok:
                  value:
                    schemaVersion: "1"
                    sigunCode: "44230"
                    sigunName: 논산시
                    prepared: true
                    reservoir:
                      facCode: "4423010045"
                      name: 탑정
                    asOf: "2026-07-21T00:00:00.000Z"
                    sources:
                      - 농업기반시설 시설제원_저수지
                    stale: false
                notReady:
                  value:
                    schemaVersion: "1"
                    sigunCode: "27260"
                    sigunName: null
                    prepared: false
                    reservoir: null
                    asOf: "2026-07-21T00:00:00.000Z"
                    sources:
                      - 농업기반시설 시설제원_저수지
                    stale: false
        "400":
          description: admCd·legalCode가 없거나 형식이 잘못됨 (retryable=false)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: 조회 저장소와 커밋 스냅샷 폴백까지 모두 실패함 (retryable=true)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/status:
    get:
      operationId: getStatus
      summary: 시군구의 대표 저수지 현재값과 공식 가뭄단계 조회
      parameters:
        - name: sigunCode
          in: query
          required: true
          description: KRC 시군 코드 5자리
          schema:
            type: string
            pattern: "^[0-9]{5}$"
        - name: facCode
          in: query
          required: false
          description: >-
            사용자가 **저수지 이름으로 직접 고른** 시설코드. 주어지면 그 시설을 대표 저수지로
            쓴다(같은 시군 후보일 때만). 없거나 형식이 어긋나면 무시하고 규칙대로 고른다 —
            지역 조회 자체는 실패시키지 않는다
          schema:
            type: string
            pattern: "^[0-9]{10}$"
      responses:
        "200":
          description: >-
            대표 저수지 관측값과 지역 공식 단계. 수위 API 장애 시에도
            Supabase·커밋 스냅샷 폴백으로 stale=true HTTP 200을 유지한다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
              examples:
                ok:
                  value:
                    schemaVersion: "1"
                    sigunCode: "44230"
                    sigunName: 논산시
                    reservoir:
                      facCode: "4423010045"
                      name: 탑정
                      rate: 87.5
                      waterLevel: 32.1
                      observedOn: "2026-07-20"
                    region:
                      observedOn: "2026-07-20"
                      regionalRate: 82.4
                      normalRate: 88.1
                      avgRatio: 93.5
                      officialStage:
                        code: ok
                        label: 정상
                    highWaterNotice: false
                    asOf: "2026-07-21T00:00:00.000Z"
                    sources:
                      - 농촌용수 저수지 수위정보 조회
                      - 논가뭄지도
                    stale: false
                    yearlyPosition:
                      year: 2025
                      percentile: 10
                      bucket: low
                      min: 71.4
                      max: 141.8
                stale:
                  value:
                    schemaVersion: "1"
                    sigunCode: "46170"
                    sigunName: 나주시
                    reservoir:
                      facCode: "4617010001"
                      name: 나주
                      rate: null
                      waterLevel: null
                      observedOn: null
                    region:
                      observedOn: "2026-07-14"
                      regionalRate: 91.2
                      normalRate: 65.1
                      avgRatio: 140.1
                      officialStage:
                        code: ok
                        label: 정상
                    highWaterNotice: false
                    asOf: "2026-07-21T00:00:00.000Z"
                    sources:
                      - Supabase 스냅샷
                      - 논가뭄지도
                    stale: true
                    yearlyPosition:
                      year: 2025
                      percentile: 93
                      bucket: high
                      min: 107
                      max: 143.3
        "400":
          description: sigunCode가 없거나 5자리 숫자가 아님 (retryable=false)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: 준비되지 않은 시군구 코드 (retryable=false)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: 수위 API·Supabase·커밋 스냅샷 폴백이 모두 실패함 (retryable=true)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/forecast:
    get:
      operationId: getForecast
      summary: 시군구 avgRatio 14일 예측과 다음 단계 도달 가능 시점 조회
      parameters:
        - name: sigunCode
          in: query
          required: true
          description: KRC 시군 코드 5자리
          schema:
            type: string
            pattern: "^[0-9]{5}$"
      responses:
        "200":
          description: >-
            최근 30일 실측과 14일 예측·밴드·추세·도달 버킷. 참고 표현 전용으로
