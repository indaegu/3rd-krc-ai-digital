  /api/v1/coach:
    get:
      operationId: getCoach
      summary: 시군구 상태 기반 물관리 코치 문구 조회
      parameters:
        - name: sigunCode
          in: query
          required: true
          description: KRC 시군 코드 5자리
          schema:
            type: string
            pattern: "^[0-9]{5}$"
        - name: facCode
          in: query
          required: false
          description: >-
            사용자가 저수지 이름으로 직접 고른 시설코드. **status와 같은 시설을 봐야 한다** —
            만수위 참고와 그에 딸린 행동(`hw_check_drain`)이 시설별로 갈리기 때문이다.
            없거나 형식이 어긋나면 무시하고 규칙대로 대표지를 고른다.
            서버 캐시 키에는 넣지 않는다 — 키는 비식별 팩트(단계·계절·버킷·만수위·행동 ID)로만
            만들며, 저수지가 바뀌면 그 팩트가 이미 함께 바뀐다
          schema:
            type: string
            pattern: "^[0-9]{10}$"
      responses:
        "200":
          description: >-
            검토 완료 행동 카탈로그 기반 코치 응답. LLM 폴백도 HTTP 200이며
            mode=static과 fallbackReason으로 관측한다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachResponse"
              examples:
                static:
                  value:
                    schemaVersion: "1"
                    mode: static
                    dataStale: false
                    cacheHit: false
                    generatedAt: "2026-07-21T00:00:00.000Z"
                    promptVersion: coach-v1
                    actionCatalogVersion: actions-v1
                    coach:
                      headline: 지금 할 일을 하나씩 확인해요.
                      summary: 예측은 참고 정보예요. 공식 가뭄 예·경보를 먼저 확인해요.
                      actions:
                        - id: care_save_paddy_water
                          title: 물꼬를 조금만 열어 두어요
                          reason: 논물을 아껴 쓰면 다음 단계까지 여유가 생겨요.
                        - id: care_check_official_notice
                          title: 공식 가뭄 안내를 확인해요
                          reason: 우리 지역 공식 예·경보가 가장 정확한 기준이에요.
                        - id: care_plan_water_order
                          title: 물 대는 순서를 정해요
                          reason: 필요한 논부터 차례로 물을 대면 부담이 줄어요.
                    fallbackReason: disabled
                    asOf: "2026-07-21T00:00:00.000Z"
                    sources:
                      - 논가뭄지도
                    stale: false
        "400":
          description: sigunCode가 없거나 5자리 숫자가 아님 (retryable=false)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: 준비되지 않은 시군구 코드 (retryable=false)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: 상태·예측 조회와 커밋 스냅샷 폴백이 모두 실패함 (retryable=true)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/regions/nearby:
    get:
      operationId: getNearby
      summary: 같은 시·도 안의 지역별 가뭄단계·평년대비 저수율 비교 조회
      parameters:
        - name: sigunCode
          in: query
          required: true
          description: KRC 시군 코드 5자리
          schema:
            type: string
            pattern: "^[0-9]{5}$"
      responses:
        "200":
          description: >-
            요청 지역과 같은 시·도에 속한 지역들의 최신 공식 단계·평년 대비
            저수율 목록(가뭄 심한 순). 커밋 스냅샷 기반이라 stale=true다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NearbyResponse"
              examples:
                ok:
                  value:
                    schemaVersion: "1"
                    sidoName: 충남
                    asOf: "2025-12-31"
                    regions:
                      - sigunCode: "44270"
                        sigunName: 당진시
                        avgRatio: 71.9
                        stageCode: ok
                        current: false
                      - sigunCode: "44230"
                        sigunName: 논산시
                        avgRatio: 112.7
                        stageCode: ok
                        current: true
                    stale: true
                    sources:
                      - 커밋 스냅샷(기준 2025-12-31)
        "400":
          description: sigunCode가 없거나 5자리 숫자가 아님 (retryable=false)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: 스냅샷에 없는 시군구 코드 (retryable=false)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: 커밋 스냅샷을 불러오지 못함 (retryable=true)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - service
        - status
        - asOf
        - sources
        - stale
      properties:
        schemaVersion:
          type: string
          const: "1"
        service:
          type: string
          const: mulsigye-api
        status:
          type: string
          const: ok
        asOf:
          type: string
          format: date-time
        sources:
          type: array
          items:
            type: string
        stale:
          type: boolean
    ApiError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - retryable
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        retryable:
          type: boolean
    RegionCandidate:
      type: object
      additionalProperties: false
      required:
        - label
        - admCd
        - legalCode
      properties:
        emdNm:
          type: string
          description: >-
            읍·면·동 이름. 클라이언트가 resolve 요청에 그대로 실어 보내 대표 저수지를
            좁히는 데 쓴다(저장하지 않는다). 도심 주소 등에서는 빈 문자열일 수 있다
        liNm:
          type: string
          description: 리 이름. 쓰임은 emdNm과 같다
        label:
          type: string
          minLength: 1
          description: 표시용 도로명주소. 선택 후 폐기하며 서버에 저장하지 않는다
        admCd:
          type: string
          pattern: "^[0-9]{10}$"
          description: 행정구역코드 10자리
        legalCode:
          type: string
          pattern: "^[0-9]{10}$"
          description: bdMgtSn 앞 10자리 법정동코드. admCd가 KRC 시군코드와 불일치할 때 폴백
    RegionSearchResponse:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - candidates
        - asOf
        - sources
        - stale
      properties:
        schemaVersion:
          type: string
          const: "1"
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/RegionCandidate"
        asOf:
          type: string
          format: date-time
        sources:
          type: array
          items:
            type: string
        stale:
          type: boolean
    ReservoirSearchResponse:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - reservoirs
        - asOf
        - sources
        - stale
      properties:
        schemaVersion:
          type: string
          const: "1"
        reservoirs:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required:
              - facCode
              - name
              - address
              - sigunCode
              - sigunName
              - prepared
            properties:
              facCode:
                type: string
                pattern: "^[0-9]{10}$"
              name:
                type: string
                minLength: 1
              address:
                type:
                  - string
                  - "null"
                description: 시설제원 소재지. 같은 이름이 여러 곳에 있어 구분에 필요하다
              sigunCode:
                type: string
                pattern: "^[0-9]{5}$"
              sigunName:
                type:
                  - string
                  - "null"
                description: 논가뭄지도 기준 시군명. 준비되지 않은 시군이면 null
              prepared:
                type: boolean
                description: >-
                  논가뭄지도에 있는 시군이라 등록 가능한지. false면 화면에서 "준비 중"으로
                  알리고 선택을 막는다(결과를 통째로 감추지 않는다)
        asOf:
          type: string
          format: date-time
        sources:
          type: array
          items:
            type: string
        stale:
          type: boolean
    RegionResolveRequest:
      type: object
      additionalProperties: false
      required:
        - admCd
        - legalCode
      properties:
        admCd:
          type: string
          pattern: "^[0-9]{10}$"
        legalCode:
          type: string
          pattern: "^[0-9]{10}$"
        emdNm:
          type: string
          maxLength: 30
          description: >-
            도로명주소가 준 읍·면·동 이름(예 "조천읍"). **시군 안에서 대표 저수지를 좁히는
            데만** 쓰고 저장·로그에 남기지 않는다. 시설제원에 좌표가 없어 거리 계산은
            하지 않으며, 행정구역 단위로만 좁힌다. 없으면 종전처럼 시군 단위로 고른다
        liNm:
          type: string
          maxLength: 30
          description: 도로명주소가 준 리 이름(예 "함덕리"). 쓰임·보관 규칙은 emdNm과 같다
        facCode:
          type: string
          pattern: "^[0-9]{10}$"
          description: >-
            사용자가 **저수지 이름으로 직접 고른** 시설코드. 주어지면 그 시설을 대표 저수지로
            쓴다(같은 시군 후보일 때만). 넓은 시군에서 주소만으로는 원하는 저수지가 안 잡힐 때
            쓰는 길이다
    RepresentativeReservoir:
      type: object
      additionalProperties: false
      description: 우리 지역 대표 저수지. 거리 필드는 두지 않는다
      required:
        - facCode
        - name
      properties:
        facCode:
          type: string
          pattern: "^[0-9]{10}$"
          description: KRC 시설코드 10자리. 앞 5자리가 시군코드
        name:
          type: string
          minLength: 1
    RegionResolveResponse:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - sigunCode
        - sigunName
        - prepared
        - reservoir
        - asOf
        - sources
        - stale
      properties:
        schemaVersion:
          type: string
          const: "1"
        sigunCode:
          type:
            - string
            - "null"
          description: KRC 시군 코드 5자리. 판정 불가면 null
        sigunName:
          type:
            - string
            - "null"
        prepared:
          type: boolean
          description: false면 "이 지역은 준비 중이에요"를 표시한다
        reservoir:
          oneOf:
            - $ref: "#/components/schemas/RepresentativeReservoir"
            - type: "null"
        asOf:
          type: string
          format: date-time
        sources:
          type: array
          items:
            type: string
        stale:
          type: boolean
    DroughtStage:
      type: object
      additionalProperties: false
      description: 공식 가뭄단계. code는 UI 토큰, label은 한국어 공식 명칭
      required:
        - code
        - label
      properties:
        code:
          type: string
          enum:
            - ok
            - watch
            - care
            - alert
            - crit
        label:
          type: string
          enum:
            - 정상
            - 관심
            - 주의
            - 경계
            - 심각
    StatusResponse:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - sigunCode
        - sigunName
        - reservoir
        - region
        - highWaterNotice
        - asOf
        - sources
        - stale
      properties:
        schemaVersion:
          type: string
          const: "1"
        sigunCode:
          type: string
          pattern: "^[0-9]{5}$"
        sigunName:
          type: string
        reservoir:
          type: object
          additionalProperties: false
          description: 우리 지역 대표 저수지의 최신 관측값
          required:
            - facCode
            - name
            - rate
            - waterLevel
            - observedOn
          properties:
            facCode:
              type: string
              pattern: "^[0-9]{10}$"
            name:
              type: string
              minLength: 1
            rate:
              type:
                - number
                - "null"
              minimum: 0
              description: 원저수율 %. 100 초과 가능. avgRatio와 섞지 않는다
            waterLevel:
              type:
                - number
                - "null"
              description: 수위(m)
            observedOn:
              type:
                - string
                - "null"
              format: date
              description: KST 달력일 YYYY-MM-DD
            rateHistory:
              type: array
              maxItems: 60
              description: >-
                대표 저수지의 최근 실측 저수율(오래된 날짜부터). 지역 평년 대비와 축이 다르므로
                차트에서 토글로만 함께 보여준다. 값이 없으면 빈 배열이다.
              items:
                type: object
                additionalProperties: false
                required:
                  - observedOn
                  - rate
                properties:
                  observedOn:
                    type: string
                    format: date
                  rate:
                    type: number
                    minimum: 0

        region:
          type: object
          additionalProperties: false
          description: 논가뭄지도 기준 지역 공식 값
          required:
            - observedOn
            - regionalRate
            - normalRate
            - avgRatio
            - officialStage
          properties:
            observedOn:
              type: string
              format: date
              description: KST 달력일 YYYY-MM-DD
            regionalRate:
              type:
                - number
                - "null"
              minimum: 0
              description: 시군 통합 저수율 %
            normalRate:
              type:
                - number
                - "null"
              minimum: 0
              description: 평년 저수율 %
            avgRatio:
              type: number
              minimum: 0
              description: 평년 대비 저수율 %. 100 초과 가능(실측 140.1). 일일 변화량은 %p
            officialStage:
              $ref: "#/components/schemas/DroughtStage"
            basis:
              type: string
              enum:
                - official
                - estimate
              description: >-
                이 지역 값의 출처. `official`은 논가뭄지도 공표값 그대로,
                `estimate`는 저수지 실측을 시군 통합저수율로 집계해 서버가 계산한
                오늘 추정값이다(AGENTS.md 규칙 5 예외). 필드가 없으면 `official`로 본다.
                단계 임계값(70/60/50/40)은 두 경우 모두 같다
            estimate:
              type:
                - object
                - "null"
              additionalProperties: false
              description: >-
                `basis: estimate`일 때만 채워지는 근거. 화면은 이 값을 그대로
                표기해야 하며 추정임을 숨기지 않는다
              required:
                - maePp
                - reservoirCount
                - capacityRatio
              properties:
                maePp:
                  type: number
                  minimum: 0
                  description: 이 지역 모델의 검증 구간 평균 절대 오차(%p)
                reservoirCount:
                  type: integer
                  minimum: 1
                  description: 집계에 들어간 저수지 수
                capacityRatio:
                  type: number
                  minimum: 0
                  maximum: 1
                  description: 집계가 덮은 시군 유효저수량 비중(0~1)
        highWaterNotice:
          type: boolean
          description: >-
            만수위 '참고' 안내 여부. 대표 저수지 원저수율 95% 이상 + 상승 추세일
            때만 true이며 서버가 확정한다. 클라이언트는 이 값을 재판정하지
            않는다(자체 임계값 복제 금지). 경보가 아니라 참고 표시 전용이다
        asOf:
          type: string
          format: date-time
        sources:
          type: array
          items:
            type: string
        stale:
          type: boolean
        yearlyPosition:
          description: >-
            올해(2025) 저수율 분포 속 현재 avgRatio의 위치(참고 표시 전용).
            서버가 커밋 스냅샷의 지역 분포로 백분위·구간을 확정하며 클라이언트는
            재계산하지 않는다. 스냅샷에 없는 지역은 null. v1 호환 additive 필드다
          type:
            - object
            - "null"
          additionalProperties: false
          required:
            - year
            - percentile
            - bucket
            - min
            - max
          properties:
            year:
              type: integer
              description: 분포 기준 연도(2025)
            percentile:
              type: number
              minimum: 0
              maximum: 100
              description: 올해 분포에서 현재 avgRatio의 백분위(0..100, 정수)
            bucket:
              type: string
              enum:
                - low
                - mid
                - high
              description: 백분위 구간. low<33.3, mid<66.7, 그 이상 high
            min:
              type: number
              description: 올해 분포 최솟값(avgRatio %)
            max:
              type: number
              description: 올해 분포 최댓값(avgRatio %)
        stageBands:
          description: >-
            공인 가뭄단계 구간(평년 대비 %). 정상→심각 순서로 각 단계의 하한
            minRatio를 담는다(ok=70, watch=60, care=50, alert=40, crit=0).
            임계값의 단일 출처는 서버 drought-stage이며 클라이언트는 이 숫자를
            복제하지 않는다 — 게이지의 단계 눈금에 그대로 쓴다. 값이 없으면
            게이지는 눈금 없이 채움만 그린다. v1 호환 additive 옵션 필드다
          type: array
          minItems: 5
          maxItems: 5
          items:
            type: object
            additionalProperties: false
            required:
              - code
              - label
              - minRatio
            properties:
              code:
                type: string
                enum:
                  - ok
                  - watch
                  - care
                  - alert
                  - crit
              label:
                type: string
                description: 단계 한국어 라벨
              minRatio:
                type: number
                minimum: 0
                description: 이 단계의 평년 대비 하한(%). ok=70 … alert=40, crit=0
    NearbyResponse:
      type: object
      additionalProperties: false
      description: >-
        요청 지역과 같은 시·도에 속한 지역들의 최신 공식 단계·평년 대비
        저수율 비교. 좌표가 없어 '주변'은 같은 시·도로 정의한다. 커밋
        스냅샷 기반이라 stale=true다
      required:
        - schemaVersion
        - sidoName
        - asOf
        - regions
        - stale
        - sources
      properties:
        schemaVersion:
          type: string
          const: "1"
        sidoName:
          type: string
          minLength: 1
          description: 요청 지역이 속한 시·도 이름(예 충남)
        asOf:
          type: string
          description: 이 시·도 안에서 관측된 최신 날짜(YYYY-MM-DD)
        regions:
          type: array
          description: 같은 시·도 지역 목록. 가뭄 심한 순(avgRatio 오름차순)으로 정렬한다
          items:
            type: object
            additionalProperties: false
            required:
              - sigunCode
              - sigunName
              - avgRatio
              - stageCode
              - current
            properties:
              sigunCode:
                type: string
                pattern: "^[0-9]{5}$"
              sigunName:
                type: string
                minLength: 1
              avgRatio:
                type: number
                minimum: 0
                description: 평년 대비 저수율 %. 100 초과 가능(실측 140.1)
              stageCode:
                type: string
                enum:
                  - ok
                  - watch
                  - care
                  - alert
                  - crit
                description: 공식 가뭄단계 코드. 스냅샷의 officialStage에서 그대로 매핑한다
              current:
                type: boolean
                description: 요청한 우리 지역이면 true
        stale:
          type: boolean
        sources:
          type: array
          items:
            type: string
    ForecastPoint:
      type: object
      additionalProperties: false
      description: 실측 avgRatio 시계열 점
      required:
        - observedOn
        - avgRatio
      properties:
        observedOn:
          type: string
          format: date
          description: KST 달력일 YYYY-MM-DD
        avgRatio:
          type: number
          minimum: 0
          description: 평년 대비 저수율 %. 100 초과 가능
    ForecastBandPoint:
      type: object
      additionalProperties: false
      description: 14일 예측 점과 불확실성 밴드. 밴드 산식은 model.bandMethod가 정의
      required:
        - observedOn
        - avgRatio
        - low
        - high
      properties:
        observedOn:
          type: string
          format: date
          description: KST 달력일 YYYY-MM-DD
        avgRatio:
          type: number
          minimum: 0
          description: 채택 모델의 예측 avgRatio %
        low:
          type: number
          description: 밴드 하한 %p 반영값
        high:
          type: number
          description: 밴드 상한 %p 반영값
    ForecastResponse:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - sigunCode
        - sigunName
        - basis
        - history
        - forecast
        - trend
        - reach
        - model
        - officialOutlook
        - asOf
        - sources
        - stale
      properties:
        schemaVersion:
          type: string
          const: "1"
        sigunCode:
          type: string
          pattern: "^[0-9]{5}$"
        sigunName:
          type: string
        basis:
          type: object
          additionalProperties: false
          description: 최신 실측 기준점
          required:
            - observedOn
            - avgRatio
            - officialStage
          properties:
            observedOn:
              type: string
              format: date
              description: KST 달력일 YYYY-MM-DD
            avgRatio:
              type: number
              minimum: 0
              description: 평년 대비 저수율 %. 100 초과 가능
            officialStage:
              $ref: "#/components/schemas/DroughtStage"
            basis:
              type: string
              enum:
                - official
                - estimate
              description: >-
                `StatusResponse.region.basis`와 같은 뜻이다. 같은 화면에서 오늘 값과
                그래프 기준이 어긋나지 않도록 두 응답이 같은 시계열을 쓴다.
                필드가 없으면 `official`로 본다
            estimate:
              type:
                - object
                - "null"
              additionalProperties: false
              description: "`basis: estimate`일 때만 채워지는 근거"
              required:
                - maePp
                - reservoirCount
                - capacityRatio
              properties:
                maePp:
                  type: number
                  minimum: 0
                reservoirCount:
                  type: integer
                  minimum: 1
                capacityRatio:
                  type: number
                  minimum: 0
                  maximum: 1
        history:
          type: array
          description: 최근 60일 실측(실선)
          maxItems: 60
          items:
            $ref: "#/components/schemas/ForecastPoint"
        forecast:
          type: array
          description: 30일 예측(점선)과 밴드
          maxItems: 30
          items:
            $ref: "#/components/schemas/ForecastBandPoint"
        trend:
          type: object
          additionalProperties: false
          required:
            - dailyDelta
            - bucket
          properties:
            dailyDelta:
              type: number
              description: >-
                일일 변화량 %p/day. 최근 14일 실측 avgRatio의 관측 선형 기울기
                (observedDailyDelta)로 계산한다. 예측선·밴드는 채택 모델과 잔차
                분위수 기반이며 추세·도달일과 근거를 분리한다
            bucket:
              type: string
              enum:
                - rising
                - stable
                - falling
              description: "|dailyDelta| < 0.05 %p/day면 stable"
        reach:
          type: object
          additionalProperties: false
          description: 다음 공인 단계 도달 가능 시점. 참고 표현 전용
          required:
            - days
            - bucket
            - targetStage
          properties:
            days:
              type:
                - number
                - "null"
              minimum: 1
              maximum: 30
              description: 1~30일만 숫자로 표시. 그 외(안정)는 null
            bucket:
              type: string
              enum:
                - none
                - within_7d
                - within_14d
                - within_30d
            targetStage:
              oneOf:
                - $ref: "#/components/schemas/DroughtStage"
                - type: "null"
              description: 도달 대상 다음 단계. 계산하지 않으면 null(심각 단계 포함)
        model:
          type: object
          additionalProperties: false
          description: 백테스트로 채택한 예측 모델 메타데이터 (data/backtest-report.json)
          required:
            - name
            - version
            - mae7
            - mae14
            - bandMethod
          properties:
            name:
              type: string
              enum:
                - naive
                - ma7
                - linear
                - ses
                - damped
            version:
              type: string
              minLength: 1
              description: 예측 상수를 포함한 모델 버전. 예 pred-v1
            mae7:
              type: number
              minimum: 0
              description: 백테스트 7일 macro MAE %p
            mae14:
              type: number
              minimum: 0
              description: 백테스트 14일 macro MAE %p (horizon 1~14 잔차)
            mae30:
              type: number
              minimum: 0
              description: >-
                백테스트 30일 macro MAE %p (horizon 1~30 잔차). 예측 지평을 30일로
                늘리며 추가한 v1 additive 필드다. 화면은 7·14·30일 오차를 함께 밝힌다
            bandMethod:
              type: string
              enum:
                - residual_quantile_p25_p75_regional
                - residual_quantile_p10_p90
                - recent_mae
              description: >-
                밴드 산식. 잔차 충분 시 경험적 25~75 분위수(50% 구간)에 지역
                bandScale을 곱한다. 부족 시 최근 14일 MAE.
                residual_quantile_p10_p90은 v1 하위호환 값
        officialOutlook:
          oneOf:
            - type: object
              additionalProperties: false
              required:
                - publishedOn
                - current
                - outlook1m
                - outlook2m
                - outlook3m
              properties:
                publishedOn:
                  type: string
                  format: date
                  description: 공식 전망 발행일 YYYY-MM-DD
                current:
                  $ref: "#/components/schemas/DroughtStage"
                outlook1m:
                  $ref: "#/components/schemas/DroughtStage"
                outlook2m:
                  $ref: "#/components/schemas/DroughtStage"
                outlook3m:
                  $ref: "#/components/schemas/DroughtStage"
                targetMonths:
                  type: array
                  minItems: 3
                  maxItems: 3
                  description: >-
                    outlook1m/2m/3m이 각각 가리키는 **대상 월**(`YYYY-MM`).
                    발행일 기준 +1/+2/+3개월이며 서버가 확정한다. 원천이 연 1회
                    갱신이라 이 값이 이미 지난 달일 수 있는데, 그때 화면에
                    "1개월 뒤"라고 쓰면 사실이 아니다 — 화면은 이 대상 월을 그대로 쓴다.
                  items:
                    type: string
                    pattern: "^[0-9]{4}-[0-9]{2}$"
                monthsSincePublished:
                  type: integer
                  minimum: 0
                  description: >-
                    발행일부터 조회 시각(asOf)까지 지난 개월 수. 서버가 확정한다.
                    화면은 이 값이 크면 "지난 전망" 고지를 덧붙인다
            - type: "null"
          description: 공식 가뭄예경보 전망 병기. 최신 발행분이 없으면 null
        stageGuide:
          type: array
          minItems: 5
          maxItems: 5
          description: >-
            단계별 행동 가이드. 5개 공인 단계(ok→crit 순)별 권장 행동 제목과
            우리 지역 현재 단계 표시. 행동 카피의 단일 출처는 서버 행동 카탈로그다.
            구 페이로드에는 없을 수 있다(선택).
          items:
            type: object
            additionalProperties: false
            required:
              - code
              - label
              - actions
              - current
            properties:
              code:
                type: string
                enum:
                  - ok
                  - watch
                  - care
                  - alert
                  - crit
              label:
                type: string
                description: 단계 한국어 라벨
              actions:
                type: array
                minItems: 1
                items:
                  type: string
                description: 해당 단계 권장 행동 제목(카탈로그 approvedTitle)
              current:
                type: boolean
                description: 우리 지역의 현재 공인 단계면 true. 정확히 1개만 true
        asOf:
          type: string
          format: date-time
        sources:
          type: array
          items:
            type: string
        stale:
          type: boolean
    CoachResponse:
      type: object
      additionalProperties: false
      description: >-
        물관리 코치 응답. LLM 폴백도 HTTP 200이며 mode로 관측한다. 클라이언트는
        mode에 따라 화면 구조를 바꾸지 않는다
      required:
        - schemaVersion
        - mode
        - dataStale
        - cacheHit
        - generatedAt
        - promptVersion
        - actionCatalogVersion
        - coach
        - fallbackReason
        - asOf
        - sources
        - stale
      properties:
        schemaVersion:
          type: string
          const: "1"
        mode:
          type: string
          enum:
            - llm
            - cache
            - static
          description: 코치 문구 출처
        dataStale:
          type: boolean
          description: KRC 데이터의 오래됨. 코치 캐시 여부와 구분한다
        cacheHit:
          type: boolean
        generatedAt:
          type: string
          format: date-time
        promptVersion:
          type: string
          minLength: 1
          description: 예 coach-v1
        actionCatalogVersion:
          type: string
          minLength: 1
          description: 예 actions-v1
        coach:
          type: object
          additionalProperties: false
          required:
            - headline
            - summary
            - actions
          properties:
            headline:
              type: string
              minLength: 1
              maxLength: 30
              description: 한 문장, ~해요체
            summary:
              type: string
              minLength: 1
              maxLength: 100
              description: 최대 두 문장, 숫자를 추가하지 않는 쉬운 요약
            actions:
              type: array
              minItems: 1
              maxItems: 3
              items:
                type: object
                additionalProperties: false
                required:
                  - id
                  - title
                  - reason
                properties:
                  id:
                    type: string
                    minLength: 1
                    description: 행동 카탈로그 ID
                  title:
                    type: string
                    minLength: 1
                    maxLength: 30
                    description: 항상 서버 행동 카탈로그에서 결합한 검토 완료 문구
                  reason:
                    type: string
                    minLength: 1
                    maxLength: 70
                    description: 한 문장, ~해요체
        fallbackReason:
          type:
            - string
            - "null"
          enum:
            - disabled
            - cache_unavailable
            - budget_exceeded
            - daily_limit
            - generation_in_progress
            - timeout
            - rate_limited
            - provider_error
            - refusal
            - max_tokens
            - validation_failed
            - null
          description: 정적 폴백 사유. LLM 정상 생성이면 null
        asOf:
          type: string
          format: date-time
        sources:
          type: array
          items:
            type: string
        stale:
          type: boolean
